# The StatefulSet's governing Service, and the way anything reaches the UI.
#
# ClusterIP, not LoadBalancer, and that is not a default anyone should change
# casually: POST /api/control is unauthenticated (see statefulset.yaml), so
# exposing this Service directly hands the automaton's play/pause/rate controls
# to whoever can route to it. Put an ingress with an auth filter in front, or
# reach it with `kubectl port-forward svc/rule110 8110:8110`.
apiVersion: v1
kind: Service
metadata:
  name: rule110
  labels:
    app.kubernetes.io/name: rule110
spec:
  # Headless, as a StatefulSet's governing Service should be: it gives the pod a
  # stable DNS name (rule110-0.rule110) rather than load-balancing across
  # replicas there is only ever one of.
  clusterIP: None
  selector:
    app.kubernetes.io/name: rule110
  ports:
    - name: http
      port: 8110
      targetPort: http
